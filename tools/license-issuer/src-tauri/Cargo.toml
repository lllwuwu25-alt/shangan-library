[package]
name = "license-issuer"
version = "0.7.0"
description = "上岸资料库授权签发工具"
authors = ["Shangan Library"]
license = "Proprietary"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "license_issuer"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
license-protocol = { path = "../../../crates/license-protocol" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
client-app = { package = "app", path = "../../../src-tauri" }
tempfile = "3"
