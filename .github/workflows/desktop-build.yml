name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-15
            artifact-name: shangan-library-macos-apple-silicon
            build-args: -- --bundles dmg
            artifact-path: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - label: macOS Intel
            os: macos-15-intel
            artifact-name: shangan-library-macos-intel
            build-args: -- --bundles dmg
            artifact-path: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - label: Windows
            os: windows-latest
            artifact-name: shangan-library-windows
            build-args: -- --bundles nsis
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test customer application
        run: npm test

      - name: Verify commercial release boundary
        run: npm run license:check-release

      - name: Test customer license verifier
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build desktop app
        run: npm run desktop:build ${{ matrix.build-args }}
        env:
          VITE_DEMO_MODE: "false"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Publish downloadable release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Remove ungated v0.6.1 installer assets
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag: 'v0.6.1',
            })
            const installerPattern = /\.(?:dmg|exe|msi)$/i
            const installerAssets = release.assets.filter((asset) => installerPattern.test(asset.name))
            for (const asset of installerAssets) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: asset.id,
              })
              core.info(`Removed v0.6.1 installer asset: ${asset.name}`)
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 上岸资料库 ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: release-assets/**/*
